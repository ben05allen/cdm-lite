minimum_prek_version = "0.4.0"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-json" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },   # Keeps line endings safe for Windows
]

[[repos]]
repo = "local"
hooks = [
  { id = "ruff", name = "ruff", entry = "uv run ruff check --fix", language = "system", types = [
    "python",
  ] },
  { id = "ruff-format", name = "ruff format", entry = "uv run ruff format", language = "system", types = [
    "python",
  ] },
  { id = "ty", name = "ty", entry = "uv run ty check", language = "system", types = [
    "python",
  ] },
  { id = "complexipy", name = "complexipy", entry = "uv run complexipy . --max-complexity-allowed 10", language = "system", types = [
    "python",
  ], pass_filenames = false },
]
