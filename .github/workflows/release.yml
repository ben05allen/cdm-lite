name: Release

# Releases are published from tags only. Push a `v*` tag whose version matches
# the version in pyproject.toml and the CHANGELOG entry for that version.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # mint a short-lived PyPI upload token (PEP 740 trusted publishing)

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # The `pypi` environment must match the environment name configured in the
    # PyPI trusted publisher settings.
    environment:
      name: pypi
      url: https://pypi.org/project/cdm-lite/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify tag matches the project version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(uv run --no-project python -c \
            "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $project_version"
            exit 1
          fi
          echo "Releasing version $project_version"

      - name: Verify the CHANGELOG documents this version
        run: |
          version="$(uv run --no-project python -c \
            "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version. Run scripts/bump_version.py first."
            exit 1
          fi

      - name: Build distributions
        run: uv build

      # Idempotency guard: a tag for a version that is already fully on PyPI
      # (released manually first, or a re-run of this workflow) must not fail
      # on duplicate uploads. Compared by filename on purpose: the wheel hash
      # includes the `Generator: uv <version>` stamp of whatever uv built it,
      # so two valid builds of identical sources never hash-match.
      - name: Check whether the release is already complete on PyPI
        id: published
        run: |
          uv run --no-project python - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import tomllib
          import urllib.request

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          # uv build drops a .gitignore into dist/; only real artifacts count
          local = {
              path.name
              for path in pathlib.Path("dist").iterdir()
              if not path.name.startswith(".")
          }

          try:
              url = f"https://pypi.org/pypi/cdm-lite/{version}/json"
              with urllib.request.urlopen(url, timeout=15) as response:
                  remote = {item["filename"] for item in json.load(response)["urls"]}
          except Exception:
              remote = set()  # version not published yet -> upload everything

          missing = sorted(local - remote)
          complete = bool(local) and not missing
          print(f"complete={'true' if complete else 'false'}")
          print(f"missing={' '.join(missing)}")
          PY

      - name: Publish to PyPI
        if: steps.published.outputs.complete != 'true'
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

      - name: Release already published
        if: steps.published.outputs.complete == 'true'
        run: echo "All files for this version are already on PyPI; nothing to upload."
